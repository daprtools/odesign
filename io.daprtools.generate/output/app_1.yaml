apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
	name: app_1
	namespace: dev
spec:

	accessControl: 
		defaultAction: deny
		trustDomain: public
		policies:
		- appId: app_3
		  defaultAction: allow
		  namespace: dev	
		  operations: 
		  - name: order1
			action: deny			
		  - name: /account
			httpVerb: ['GET', 'POST',]
			action: deny			
		- appId: app_2
		  defaultAction: allow
		  namespace: dev	

	components:
		deny: 
		 - pubsub.kafka
		 - bindings.postgresql

	logging:
		apiLogging:
			enabled: false
			obfuscateURLs: 	false
			omitHealthChecks: true

	nameResolution:
    	component: "sqlite"
    	version: "v1"
    	configuration:
      		connectionString: "/home/user/.dapr/nr.db"

	secret: 
		scopes: 
			- storeName: secretstore
      		  defaultAccess: allow
			  deniedSecrets: ["dsec1","dsec2",]
			- storeName: secretstore
			  defaultAccess: deny




