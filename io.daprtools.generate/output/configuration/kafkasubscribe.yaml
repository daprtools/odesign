apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: kafkasubscribe
spec:
  topic: delivery
  routes:
    rules:
      - match: event.type == "widget"
        path: /widgets
      - match: event.type == "ping"
        path: /ping
      - match: event.type == "healthz"
        path: /health
  pubsubname: kafka_local
  deadLetterTopic: deadones
  bulkSubscribe: 
    enabled: true
    maxMessagesCount: 10
    maxAwaitDurationMs: 20
scopes:
  - account
  - app_2
  - app_1
