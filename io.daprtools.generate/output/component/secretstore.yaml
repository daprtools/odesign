apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
    name: secretstore
    namespace: dev
spec:
    type: secretstores.aws.secretmanager
    version: v1
    ignoreErrors: false
    metadata:
        - name: region
          value: us-east-1
        - name: accessKey
          value: 12345
        - name: secretKey
          envRef: AWS_SECRETKEY

